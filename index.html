<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Alice in Chains — Dirt</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dirt.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Rubik+Dirt&family=Inter:wght@300;400;500;600&display=swap"
        rel="stylesheet">
</head>

<body>
    <!-- Fundo com Blur (Capa) -->
    <div class="ambient-background" id="ambient-bg" aria-hidden="true"></div>

    <main class="app-container">
        <!-- Cabeçalho / Informações Iniciais -->
        <header class="album-header">
            <div class="cover-container">
                <div class="vinyl-disc" id="vinyl-disc" aria-hidden="true"></div>
                <div class="cover-frame">
                    <img src="" alt="Capa do Álbum" id="album-cover" class="album-cover">
                </div>
            </div>
            <div class="album-info-summary">
                <h2 id="album-artist">Alice in Chains</h2>
                <h1 id="album-title">Dirt</h1>
                <div class="album-meta" id="album-meta">
                    <!-- Gerado pelo JS -->
                </div>
            </div>
            <nav class="secondary-nav">
                <button id="btn-about" aria-label="Sobre o álbum"><svg viewBox="0 0 24 24" fill="currentColor"
                        width="16" height="16" style="vertical-align: middle; margin-right: 4px;">
                        <path
                            d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z" />
                    </svg> Sobre o álbum</button>
                <button id="btn-awards" aria-label="Premiações"><svg viewBox="0 0 24 24" fill="currentColor" width="16"
                        height="16" style="vertical-align: middle; margin-right: 4px;">
                        <path
                            d="M19 5h-2V3H7v2H5c-1.1 0-2 .9-2 2v1c0 2.55 1.92 4.63 4.39 4.94A5.01 5.01 0 0011 15.9V19H7v2h10v-2h-4v-3.1a5.01 5.01 0 003.61-2.96C19.08 12.63 21 10.55 21 8V7c0-1.1-.9-2-2-2zM5 8V7h2v3.82C5.84 10.4 5 9.3 5 8zm14 0c0 1.3-.84 2.4-2 2.82V7h2v1z" />
                    </svg> Premiações</button>
                <button id="btn-credits" aria-label="Ficha técnica"><svg viewBox="0 0 24 24" fill="currentColor"
                        width="16" height="16" style="vertical-align: middle; margin-right: 4px;">
                        <path
                            d="M18 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 4h5v8l-2.5-1.5L6 12V4z" />
                    </svg> Ficha técnica</button>
            </nav>
        </header>

        <!-- Player -->
        <section class="player-section" aria-label="Player de áudio">
            <div class="current-track-info">
                <h3 id="current-title">Selecione uma faixa</h3>
                <p id="current-composers" class="composers">--</p>
            </div>

            <div class="progress-container">
                <span id="time-current">00:00</span>
                <input type="range" id="progress-bar" min="0" max="100" value="0" aria-label="Barra de progresso">
                <span id="time-total">00:00</span>
            </div>

            <div class="controls">
                <button id="btn-shuffle" class="control-btn" aria-label="Modo aleatório" title="Aleatório"><svg
                        viewBox="0 0 24 24" fill="currentColor" width="24" height="24">
                        <path
                            d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z" />
                    </svg></button>
                <button id="btn-prev" class="control-btn" aria-label="Faixa anterior"><svg viewBox="0 0 24 24"
                        fill="currentColor" width="32" height="32">
                        <path d="M6 6h2v12H6zm3.5 6l8.5 6V6z" />
                    </svg></button>
                <button id="btn-play-pause" class="control-btn play-btn" aria-label="Play"><svg viewBox="0 0 24 24"
                        fill="currentColor" width="48" height="48">
                        <path d="M8 5v14l11-7z" />
                    </svg></button>
                <button id="btn-next" class="control-btn" aria-label="Próxima faixa"><svg viewBox="0 0 24 24"
                        fill="currentColor" width="32" height="32">
                        <path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z" />
                    </svg></button>
                <button id="btn-repeat" class="control-btn" aria-label="Modo de repetição" title="Repetir"><svg
                        viewBox="0 0 24 24" fill="currentColor" width="24" height="24">
                        <path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z" />
                    </svg></button>
            </div>
            <div class="volume-control">
                <span class="volume-icon"><svg viewBox="0 0 24 24" fill="currentColor" width="20" height="20">
                        <path
                            d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z" />
                    </svg></span>
                <input type="range" id="volume-bar" min="0" max="1" step="0.01" value="1" aria-label="Volume">
            </div>

            <audio id="audio-element" preload="none"></audio>
        </section>

        <!-- Layout em Duas Colunas para Desktop, empilhado para Mobile -->
        <div class="content-split">
            <!-- Lista de Faixas -->
            <section class="tracklist-section">
                <ul id="tracklist" class="tracklist">
                    <!-- Gerado pelo JS -->
                </ul>
            </section>

            <!-- Área de Letras -->
            <section class="lyrics-section" aria-label="Letra da música">
                <div class="lyrics-header">
                    <div class="lyrics-header-top">
                        <h3 id="lyrics-title">Letra</h3>
                        <button id="btn-toggle-lyrics" class="btn-toggle-lyrics" aria-label="Mostrar/esconder letra"
                            title="Mostrar/esconder letra">
                            <svg id="lyrics-toggle-icon" viewBox="0 0 24 24" fill="currentColor" width="18" height="18">
                                <path d="M7 10l5 5 5-5z" />
                            </svg>
                        </button>
                    </div>
                    <p id="lyrics-composers" class="composers"></p>
                </div>
                <div id="lyrics-content" class="lyrics-content">
                    <p class="empty-state">Selecione uma música para ver a letra.</p>
                </div>
            </section>
        </div>
    </main>

    <!-- Modais / Drawers (Escondidos por padrão) -->
    <!-- Sobre o Álbum -->
    <dialog id="modal-about" class="modal">
        <div class="modal-content">
            <button class="close-modal" aria-label="Fechar">✖</button>
            <h2>Sobre o Álbum</h2>
            <div id="about-content" class="modal-body"></div>
        </div>
    </dialog>

    <!-- Premiações -->
    <dialog id="modal-awards" class="modal">
        <div class="modal-content">
            <button class="close-modal" aria-label="Fechar">✖</button>
            <h2>Premiações</h2>
            <div id="awards-content" class="modal-body"></div>
        </div>
    </dialog>

    <!-- Ficha Técnica -->
    <dialog id="modal-credits" class="modal">
        <div class="modal-content">
            <button class="close-modal" aria-label="Fechar">✖</button>
            <h2>Ficha Técnica</h2>
            <div id="credits-content" class="modal-body"></div>
        </div>
    </dialog>

    <!-- Scripts -->
    <script src="data/album.js"></script>
    <script src="js/player.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
